# ShaderGlassVk: name the layer in the session's VK_INSTANCE_LAYERS, after whatever is already there.
#
# That puts it below DLSS5VKLayer, whose own configuration names itself here too (see
# docs/DLSS5VKLayer.md): explicitly enabled layers sit below implicit ones, and among explicit ones
# the order of this list decides. Named after it, ShaderGlass composes last, on the finished picture.
#
# Both architectures are named; each process loads the one matching its word size. Being listed loads
# the layer into every Vulkan program in the session, where it stays idle and silent unless the
# program was started with SHADERGLASS=1.
#
# Read by systemd at login. The file name sorts after dlssnr.conf, so the value that sets is already
# there to append to.
VK_INSTANCE_LAYERS="${VK_INSTANCE_LAYERS:+${VK_INSTANCE_LAYERS}:}VK_LAYER_SHADERGLASS:VK_LAYER_SHADERGLASS_32"
